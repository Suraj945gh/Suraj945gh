# Generates assets/metrics.svg daily. Uses your own token so private contributions are counted.
# Setup: repository secret METRICS_TOKEN (classic PAT with scopes: repo, read:org, read:user).
name: Metrics

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          # header + activity + community only: drops the noisy repository rows (releases, packages, MB used, sponsors)
          base: header, activity, community, metadata
          config_timezone: Asia/Kolkata
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_ignored: jupyter notebook, cython
          # terminal theme: neon green headings, cyan icons, grey text
          extras_css: |
            .field, .field span { color: #8B949E !important; }
            svg.octicon, .field svg { fill: #00F5FF !important; }
            h1.field, h1.field span, h2.field, h2.field span, h2 a, .field a { color: #00FF41 !important; }
