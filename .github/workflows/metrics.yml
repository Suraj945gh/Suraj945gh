# Generates assets/metrics.svg daily. Uses your own token so private contributions are counted.
# Setup: add a repository secret named METRICS_TOKEN (classic PAT with scopes: repo, read:org, read:user).
name: Metrics

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
